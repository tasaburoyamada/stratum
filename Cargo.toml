[package]
name = "stratum"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1.3"
half = { version = "2.0", features = ["serde"] }
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
bincode = "1.3"
rayon = "1.8"
log = "0.4"
indicatif = "0.17"
futures = "0.3"
regex = "1.0"
tiktoken-rs = "0.6"
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
tokenizers = "0.21"
walkdir = "2.3"
reqwest = { version = "0.11", default-features = false, features = ["json", "stream", "rustls-tls"] }
hnsw_rs = "0.3"
redb = "2.0"
scraper = "0.17"
html2md = "0.2"
rand = "0.8"

[dev-dependencies]
tempfile = "3.8"
env_logger = "0.11"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
