[package]
name = "stratum"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1.3"
half = { version = "2.4", features = ["serde"] }
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
bincode = "1.3"
rayon = "1.8"
log = "0.4"
indicatif = "0.17"
futures = "0.3"
regex = "1.0"
tiktoken-rs = "0.6"
candle-core = { version = "0.10" }
candle-nn = { version = "0.10" }
candle-transformers = "0.10"
tokenizers = "0.21"
walkdir = "2.3"
reqwest = { version = "0.11", default-features = false, features = ["json", "stream", "rustls-tls"] }
hnsw_rs = "0.2"
redb = { version = "2.0", optional = true }
pdf-extract = "0.7"
scraper = "0.17"
html2md = "0.2"
rand = "0.8"
hf-hub = "0.5.0"

[features]
default = ["persistence"]
persistence = ["redb"]
memory-only = []

[dev-dependencies]
tempfile = "3.8"
env_logger = "0.11"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"


[[bin]]
name = "pre_embed"
path = "src/research/selector_v1/bin/pre_embed.rs"

[[bin]]
name = "train_selector"
path = "src/bin/train_selector.rs"

[[bin]]
name = "synthesize_data"
path = "src/research/selector_v1/bin/synthesize_data.rs"
