[package]
name = "stratum-py"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "stratum"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20.0", features = ["extension-module", "abi3-py38"] }
pyo3-asyncio = { version = "0.20.0", features = ["tokio-runtime"] }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
stratum = { path = "../../" }
